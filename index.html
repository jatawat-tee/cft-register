<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cinema Functional Training</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f2f2f2;
}

.topbar{
    background:#39b54a;
    color:white;
    text-align:center;
    padding:10px;
    font-size:12px;
    font-weight:bold;
}

.container{
    padding:30px;
    text-align:center;
}

.logo1{
    margin-top:40px;
    font-size:28px;
}

.logo2{
    margin-top:5px;
    font-size:56px;
    line-height:0.95;
    color:#39b54a;
    font-weight:bold;
}

.user{
    margin-top:20px;
    margin-bottom:20px;
}

.display-name{
    font-size:18px;
    font-weight:bold;
    color:#333;
}

.line-user-id{
    margin-top:10px;
    font-size:12px;
    color:#666;
    word-break:break-all;
}

input{
    width:100%;
    height:50px;
    margin-top:30px;
    padding:12px;
    border:2px solid #39b54a;
    border-radius:4px;
    font-size:16px;
}

button{
    width:100%;
    height:55px;
    margin-top:15px;
    border:none;
    border-radius:4px;
    background:#39b54a;
    color:white;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.5;
}

.status{
    margin-top:15px;
    font-size:14px;
}

.footer{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:#39b54a;
    color:white;
    text-align:center;
    padding:8px;
    font-size:12px;
    font-weight:bold;
}

.success{
    color:green;
}

.error{
    color:red;
}

</style>

</head>

<body>

<div class="topbar">
REGISTRATION
</div>

<div class="container">

    <div class="logo1">
        CINEMA
    </div>

    <div class="logo2">
        FUNCTIONAL<br>
        TRAINING
    </div>

    <div id="userInfo" class="user">
        Loading...
    </div>

    <input
        id="empid"
        type="text"
        maxlength="9"
        placeholder="กรอกรหัสพนักงาน 9 หลัก">

    <button
        id="btnRegister"
        onclick="register()">
        REGISTER
    </button>

    <div id="status" class="status"></div>

</div>

<div class="footer">
LINE OA
</div>

<script>

const LIFF_ID = "2012456984-RGi9YPD7";

const FLOW_URL =
"https://0fa9beaa1fe4eb889f79f3312520c9.86.environment.api.powerplatform.com/powerautomate/automations/direct/cu/12/workflows/4b9e3000ff40478287ef28d68e1dbccf/triggers/manual/paths/invoke?api-version=1";

let profile = null;

async function initializeLIFF(){

    try{

        document.getElementById("userInfo").innerHTML =
        "STEP 1 : Initializing LIFF...";

        await liff.init({
            liffId: LIFF_ID
        });

        document.getElementById("userInfo").innerHTML =
        "STEP 2 : Checking Login...";

        if(!liff.isLoggedIn()){

            document.getElementById("userInfo").innerHTML =
            "STEP 3 : Redirect Login";

            liff.login();
            return;
        }

        document.getElementById("userInfo").innerHTML =
        "STEP 4 : Loading Profile";

        profile = await liff.getProfile();

        document.getElementById("userInfo").innerHTML =
        `
            <div class="display-name">
                ${profile.displayName}
            </div>

            <div class="line-user-id">
                ${profile.userId}
            </div>
        `;

    }
    catch(error){

        console.error(error);

        document.getElementById("userInfo").innerHTML =
        `
            <div class="error">
                ERROR<br><br>
                ${error.message}
            </div>
        `;

    }

}

async function register(){

    const empId =
        document.getElementById("empid")
        .value
        .trim();

    if(empId === ""){

        alert("กรุณากรอกรหัสพนักงาน");

        return;

    }

    if(!profile){

        alert("ไม่พบข้อมูล LINE");

        return;

    }

    const payload = {

        EMP_ID: empId,
        LINE_USER_ID: profile.userId,
        LINE_DISPLAY_NAME: profile.displayName

    };

    "กำลังส่งข้อมูล...";

    document.getElementById("btnRegister").disabled =
    true;
