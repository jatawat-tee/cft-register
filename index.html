<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cinema Functional Training</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
*{ box-sizing:border-box; }
body{ margin:0; background:#efefef; font-family:Arial,sans-serif; }
.topbar{ background:#39b54a; color:#fff; text-align:center; padding:12px; font-weight:bold; font-size:18px; }
.container{ padding:20px; max-width:500px; margin:auto; }
.logo1{ font-size:24px; margin-top:20px; text-align:center; }
.logo2{ font-size:42px; color:#39b54a; font-weight:bold; line-height:1; text-align:center; margin-bottom:20px; }
.form-card{ background:#fff; border-radius:12px; padding:20px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
.user{ background:#f7f7f7; border-radius:8px; padding:12px; margin-bottom:15px; color:#444; font-weight:bold; word-break:break-word; }
label{ display:block; font-size:14px; color:#555; margin:0 0 6px 2px; }
input{ width:100%; padding:18px; font-size:18px; border:2px solid #39b54a; border-radius:8px; margin-bottom:12px; }
input:disabled{ background:#f3f3f3; border-color:#cfcfcf; }
button{ width:100%; height:58px; border:none; border-radius:10px; background:#39b54a; color:#fff; font-size:22px; font-weight:bold; }
button:disabled{ background:#9e9e9e; }
#resultMessage{ display:none; margin-top:20px; background:#fff; border:2px solid #39b54a; border-radius:12px; padding:20px; line-height:1.8; text-align:center; }
#resultMessage h2{ margin:0 0 8px; }
#resultMessage p{ margin:8px 0; }
.success-btn{ margin-top:20px; }
.footer{ margin-top:30px; background:#39b54a; color:#fff; text-align:center; padding:12px; font-size:16px; }
.loading{ animation:pulse 1s infinite; }
@keyframes pulse{ 0%{opacity:.5;} 50%{opacity:1;} 100%{opacity:.5;} }
</style>
</head>
<body>

<div class="topbar">REGISTRATION</div>

<div class="container">
  <div class="logo1">CINEMA</div>
  <div class="logo2">FUNCTIONAL<br>TRAINING</div>

  <div class="form-card" id="formCard">
    <div id="userInfo" class="user loading">กำลังโหลดข้อมูล...</div>

    <label for="empid">รหัสพนักงาน</label>
    <input id="empid" type="tel" inputmode="numeric" maxlength="9" placeholder="กรอกรหัสพนักงาน 9 หลัก" disabled>

    <label for="nickname">ชื่อเล่น</label>
    <input id="nickname" type="text" maxlength="50" placeholder="ชื่อเล่น (ภาษาไทย)" disabled>

    <button id="registerBtn" onclick="registerUser()" disabled>REGISTER</button>
  </div>

  <div id="resultMessage"></div>
</div>

<div class="footer">LINE OA</div>

<script>
const LIFF_ID = "2012456984-RGi9YPD7";
const GAS_URL = "https://script.google.com/macros/s/AKfycbyn_uG_1bB4n0hIDkI0EsRDAW1Vt5vmxuw3hon9PlRJpaVJNd1rFhyu_LmhST7uQJsE/exec";
const LINE_OA_URL = "https://line.me/R/ti/p/@003bmmlp";

let profile = null;
let busy = false;

const $ = function (id) { return document.getElementById(id); };

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

async function callGAS(payload) {
  const res = await fetch(GAS_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },   // text/plain เพื่อไม่ให้เบราว์เซอร์ส่ง preflight
    body: JSON.stringify(payload)
  });
  return await res.json();
}

function setFormEnabled(on) {
  $("empid").disabled = !on;
  $("nickname").disabled = !on;
  $("registerBtn").disabled = !on;
}

function setBusy(on) {
  busy = on;
  setFormEnabled(!on);
  $("registerBtn").textContent = on ? "⏳ กำลังลงทะเบียน..." : "REGISTER";
}

/* ---------- เริ่มต้น: เปิดจากลิงก์ LIFF -> login -> ตรวจว่าลงทะเบียนแล้วหรือยัง ---------- */
async function initializeLIFF() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    profile = await liff.getProfile();
    $("userInfo").classList.remove("loading");
    $("userInfo").textContent = "👋 " + profile.displayName;
  } catch (error) {
    console.error(error);
    $("userInfo").classList.remove("loading");
    $("userInfo").textContent = "ไม่สามารถเชื่อมต่อ LINE ได้ กรุณาเปิดลิงก์ผ่านแอป LINE";
    return;
  }

  // ถ้า LINE นี้ลงทะเบียนไว้แล้ว ให้แสดงสถานะเลย ไม่ต้องกรอกซ้ำ
  try {
    const r = await callGAS({ ACTION: "CHECK", LINE_USER_ID: profile.userId });
    if (r.status === "ALREADY_REGISTERED_LINE" || r.status === "ALREADY_REGISTERED") {
      showResult("ALREADY_REGISTERED_LINE", { empId: r.empId, nickname: r.nickname });
      return;
    }
  } catch (error) {
    console.error(error);   // เช็คไม่ได้ก็ให้กรอกฟอร์มตามปกติ
  }
  setFormEnabled(true);
}

/* ---------- ส่งข้อมูลลงทะเบียน ---------- */
async function registerUser() {
  if (busy) return;

  const digits = $("empid").value.replace(/\D/g, "");
  const nickname = $("nickname").value.trim();

  if (!/^\d{1,9}$/.test(digits)) { alert("กรุณากรอกรหัสพนักงาน 9 หลัก"); return; }
  if (nickname === "") { alert("กรุณากรอกชื่อเล่น"); return; }
  if (!profile) { showResult("ERROR"); return; }

  const empId = digits.padStart(9, "0");   // ไม่ครบ 9 หลักให้เติม 0 ข้างหน้า
  setBusy(true);

  try {
    const r = await callGAS({
      EMP_ID: empId,
      NICKNAME: nickname,
      LINE_USER_ID: profile.userId,
      LINE_DISPLAY_NAME: profile.displayName
    });

    if (r.status === "SUCCESS") {
      showResult("SUCCESS", { empId: empId, nickname: nickname });
    } else if (r.status === "ALREADY_REGISTERED") {
      showResult("ALREADY_REGISTERED_LINE", { empId: r.empId, nickname: r.nickname });
    } else {
      showResult(r.status, { empId: r.empId, nickname: r.nickname });
    }
  } catch (error) {
    console.error(error);
    showResult("ERROR");
  } finally {
    setBusy(false);
  }
}

/* ---------- ผลลัพธ์ ---------- */
const RESULTS = {
  SUCCESS: {
    color: "#39b54a", title: "✅ ลงทะเบียนสำเร็จ",
    text: "ข้อมูลของท่านถูกบันทึกเข้าระบบเรียบร้อยแล้ว",
    showData: true,
    extra: "📩 ระบบได้ส่งข้อความต้อนรับไปยัง LINE OA ของท่านแล้ว",
    btn: "oa"
  },
  ALREADY_REGISTERED_LINE: {
    color: "#ff9800", title: "⚠️ บัญชี LINE นี้ลงทะเบียนแล้ว",
    text: "บัญชี LINE ของท่านได้ลงทะเบียนไว้ในระบบแล้ว",
    showData: true,
    btn: "oa"
  },
  ALREADY_REGISTERED_EMP: {
    color: "#e53935", title: "❌ รหัสพนักงานนี้ลงทะเบียนแล้ว",
    text: "กรุณาตรวจสอบรหัสพนักงานอีกครั้ง",
    btn: "retry"
  },
  EMP_NOT_FOUND: {
    color: "#e53935", title: "❌ ไม่พบรหัสพนักงาน",
    text: "กรุณาตรวจสอบรหัสพนักงานอีกครั้ง",
    btn: "retry"
  },
  ERROR: {
    color: "#e53935", title: "❌ ระบบขัดข้องชั่วคราว",
    text: "กรุณาลองใหม่อีกครั้ง",
    btn: "retry"
  }
};

function showResult(status, data) {
  data = data || {};
  const r = RESULTS[status] || RESULTS.ERROR;

  let html = '<h2 style="color:' + r.color + '">' + r.title + '</h2><p>' + r.text + '</p>';

  if (r.showData && (data.empId || data.nickname)) {
    html += '<hr>';
    if (data.empId) html += '<p><b>รหัสพนักงาน</b><br>' + esc(data.empId) + '</p>';
    if (data.nickname) html += '<p><b>ชื่อเล่น</b><br>' + esc(data.nickname) + '</p>';
  }
  if (r.extra) html += '<p>' + r.extra + '</p>';

  if (r.btn === "oa") {
    html += '<button class="success-btn" onclick="openLineOA()">🎓 เข้าใช้งาน Cinema Training</button>';
  } else {
    html += '<button class="success-btn" onclick="backToForm()">🔄 ลองใหม่อีกครั้ง</button>';
  }

  $("formCard").style.display = "none";
  const box = $("resultMessage");
  box.innerHTML = html;
  box.style.display = "block";
}

function backToForm() {
  $("resultMessage").style.display = "none";
  $("formCard").style.display = "block";
  setFormEnabled(true);
}

function openLineOA() {
  window.location.href = LINE_OA_URL;
}

// กด Enter ในช่องชื่อเล่น = ส่งข้อมูล
$("nickname").addEventListener("keydown", function (e) { if (e.key === "Enter") registerUser(); });
// ช่องรหัสพนักงานรับเฉพาะตัวเลข
$("empid").addEventListener("input", function () { this.value = this.value.replace(/\D/g, ""); });

initializeLIFF();
</script>
</body>
</html>
