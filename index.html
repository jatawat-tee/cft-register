<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cinema Registration</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.container{
    max-width:420px;
    margin:40px auto;
    background:#fff;
    padding:25px;
    border-radius:16px;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
}

h2{
    text-align:center;
    color:#06C755;
}

.info{
    text-align:center;
    margin-bottom:20px;
    word-break:break-all;
}

button{
    width:100%;
    padding:12px;
    background:#06C755;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h2>Cinema Registration</h2>

<div id="userInfo" class="info">
Loading...
</div>

<button onclick="openPowerApps()">
ลงทะเบียน
</button>

</div>

<script>

const LIFF_ID = "2012456984-RGi9YPD7";

const POWER_APPS_URL =
"https://apps.powerapps.com/play/e/0fa9beaa-1fe4-eb88-9f79-f3312520c986/a/ae67169d-16d7-49ae-9762-4468c3fc18c4?tenantId=4b3b64f8-e08e-43bc-95bf-15d8ae1d3d5c";

let profile = null;

async function initializeLIFF(){

    try{

        await liff.init({
            liffId: LIFF_ID
        });

        if(!liff.isLoggedIn()){
            liff.login();
            return;
        }

        profile = await liff.getProfile();

        document.getElementById("userInfo").innerHTML =
        `
            <strong>${profile.displayName}</strong>
            <br><br>
            LINE USER ID
            <br>
            ${profile.userId}
        `;

    }
    catch(error){

        document.getElementById("userInfo").innerHTML =
        error.message;

    }

}

function openPowerApps(){

    if(!profile){
        alert("ไม่สามารถดึงข้อมูล LINE ได้");
        return;
    }

    const appUrl =
        POWER_APPS_URL +
        "&LINE_USER_ID=" +
        encodeURIComponent(profile.userId) +
        "&DISPLAY_NAME=" +
        encodeURIComponent(profile.displayName);

    window.location.href = appUrl;

}

initializeLIFF();

</script>

</body>

</html>
