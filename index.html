<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cinema Functional Training</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f2f2f2;
}

.topbar{
    width:100%;
    background:#39b54a;
    color:white;
    text-align:center;
    padding:8px;
    font-size:12px;
    font-weight:bold;
}

.container{
    padding:30px;
    text-align:center;
}

.logo1{
    font-size:26px;
    margin-top:40px;
    color:#000;
}

.logo2{
    font-size:56px;
    line-height:0.95;
    font-weight:bold;
    color:#39b54a;
    margin-top:5px;
}

.user{
    margin-top:20px;
    margin-bottom:20px;
    color:#666;
    font-size:14px;
}

input{
    width:100%;
    height:50px;
    border:2px solid #39b54a;
    padding:10px;
    font-size:16px;
    margin-top:40px;
}

button{
    width:100%;
    height:55px;
    margin-top:15px;
    border:none;
    background:#39b54a;
    color:white;
    font-size:24px;
    font-weight:bold;
    border-radius:4px;
}

button:active{
    transform:scale(.98);
}

.footer{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#39b54a;
    color:white;
    text-align:center;
    padding:8px;
    font-size:12px;
    font-weight:bold;
}

.loading{
    color:#999;
}

</style>

</head>

<body>

<div class="topbar">
REGISTRATION
</div>

<div class="container">

<div class="logo1">
CINEMA
</div>

<div class="logo2">
FUNCTIONAL<br>
TRAINING
</div>

<div id="userInfo" class="user loading">
Loading...
</div>

<input
    id="empid"
    type="text"
    maxlength="9"
    placeholder="กรอกรหัสพนักงาน 9 หลัก">

<button onclick="register()">
REGISTER
</button>

</div>

<div class="footer">
LINE OA
</div>

<script>

const LIFF_ID = "2012456984-RGi9YPD7";

let profile = null;

async function initializeLIFF(){

    try{

        await liff.init({
            liffId: LIFF_ID
        });

        if(!liff.isLoggedIn()){
            liff.login();
            return;
        }

        profile = await liff.getProfile();

        document.getElementById("userInfo").innerHTML =
            profile.displayName;

    }
    catch(error){

        document.getElementById("userInfo").innerHTML =
            "ไม่สามารถเชื่อมต่อ LINE ได้";

        console.error(error);
    }

}

async function register(){

    const empId =
        document.getElementById("empid").value.trim();

    if(empId === ""){

        alert("กรุณากรอกรหัสพนักงาน");

        return;
    }

    const payload = {

        EMP_ID: empId,

        LINE_USER_ID: profile.userId,

        LINE_DISPLAY_NAME: profile.displayName

    };

    console.log(payload);

    alert(
        "พร้อมส่งข้อมูล\n\n" +
        "EMP_ID : " + empId
    );

    /*
    STEP ต่อไป

    ส่งเข้า API / Power Automate

    fetch(API_URL,{
        method:'POST',
        headers:{
            'Content-Type':'application/json'
        },
        body:JSON.stringify(payload)
    })

    */

}

initializeLIFF();

</script>

</body>

</html>
