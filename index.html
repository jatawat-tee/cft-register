<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cinema Registration</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.container{
    max-width:420px;
    margin:40px auto;
    background:#ffffff;
    padding:25px;
    border-radius:16px;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
}

h2{
    text-align:center;
    color:#06C755;
}

.info{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    border:1px solid #ddd;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#06C755;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    opacity:.9;
}
</style>

</head>

<body>

<div class="container">

    <h2>Cinema Registration</h2>

    <div class="info" id="userInfo">
        Loading...
    </div>

    <input
        type="text"
        id="empid"
        placeholder="กรอกรหัสพนักงาน 9 หลัก"
    >

    <button onclick="register()">
        ลงทะเบียน
    </button>

</div>

<script>

const LIFF_ID = "2012456984-RGi9YPD7";

let profile = null;

async function initializeLIFF() {

    try {

        await liff.init({
            liffId: LIFF_ID
        });

        if (!liff.isLoggedIn()) {
            liff.login();
            return;
        }

        profile = await liff.getProfile();

        document.getElementById("name")
.innerHTML =
`
สวัสดี ${profile.displayName}
<br><br>
LINE USER ID :
<br>
${profile.userId}
`;
    }
    catch(error){

        document.getElementById("userInfo").innerHTML =
            "เกิดข้อผิดพลาด : " + error.message;

        console.error(error);
    }
}

async function register(){

 const empId =
 document.getElementById("empid").value.trim();

 if(empId==""){
   alert("กรุณากรอกรหัสพนักงาน");
   return;
 }

 console.log(profile.userId);

 alert(
   "EMP_ID : " + empId +
   "\nLINE_USER_ID : " +
   profile.userId
 );

}
    /*
    STEP ต่อไป

    ส่งเข้า Power Automate

    await fetch("POWER_AUTOMATE_URL", {
       method:"POST",
       headers:{
         "Content-Type":"application/json"
       },
       body:JSON.stringify({
            empId: empId,
            lineUserId: profile.userId,
            displayName: profile.displayName
       })
    });

    */
}

initializeLIFF();

</script>

</body>
</html>
