<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Test LIFF</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

</head>
<body>

<h2>Cinema Functional Training</h2>

<div id="result">
กำลังเชื่อมต่อ LINE...
</div>

<script>

const LIFF_ID = "2011893079-nLN62Tne";

async function testLiff() {

    try {

        document.getElementById("result").innerHTML =
            "เริ่มต้น LIFF...";

        await liff.init({
            liffId: LIFF_ID
        });

        document.getElementById("result").innerHTML =
            "LIFF Init สำเร็จ";

        if (!liff.isLoggedIn()) {

            document.getElementById("result").innerHTML =
                "กำลัง Login LINE...";

            liff.login();
            return;
        }

        const profile = await liff.getProfile();

        document.getElementById("result").innerHTML =
            "✅ " + profile.displayName;

    }
    catch (error) {

        document.getElementById("result").innerHTML =
            "❌ ERROR : " + error;

        console.error(error);
    }

}

window.onload = testLiff;

</script>

</body>
</html>
