<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cinema Functional Training</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

</head>
<body>

<h2>Cinema Functional Training</h2>

<div id="profileBox">
กำลังเชื่อมต่อ LINE...
</div>

<script>

const LIFF_ID = "2011893079-nLN62Tne";

async function initializeLiff() {

    try {

        await liff.init({
            liffId: LIFF_ID
        });

        if (!liff.isLoggedIn()) {
            liff.login();
            return;
        }

        const profile = await liff.getProfile();

        document.getElementById("profileBox").innerHTML =
            "✅ " + profile.displayName;

    }
    catch(error){

        document.getElementById("profileBox").innerHTML =
            "❌ " + error.message;
    }

}

initializeLiff();

</script>

</body>
</html>
