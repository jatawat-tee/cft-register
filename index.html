            liff.login();
            return;
        }

        const profile = await liff.getProfile();

        document.getElementById("profileBox").innerHTML = `

            <b>LINE User ID</b><br>
            ${lineUserId}
        `;

    }
    catch (error) {

        console.error(error);

        document.getElementById("profileBox").innerHTML =
            "❌ " + error;

    }

}
