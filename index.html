<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cinema Functional Training</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

body{
    background:#efefef;
    font-family:Arial,sans-serif;
    margin:0;
}

.topbar{
    background:#39b54a;
    color:#fff;
    text-align:center;
    padding:10px;
    font-weight:bold;
}

.container{
    padding:30px;
    text-align:center;
}

.logo1{
    font-size:28px;
    margin-top:60px;
}

.logo2{
    font-size:64px;
    color:#39b54a;
    font-weight:bold;
    line-height:.95;
}

.user{
    margin-top:20px;
    margin-bottom:20px;
    color:#666;
}

input{
    width:100%;
    padding:14px;
    border:2px solid #39b54a;
    font-size:18px;
}

button{
    width:100%;
    height:55px;
    margin-top:20px;
    background:#39b54a;
    border:none;
    color:white;
    font-size:24px;
    font-weight:bold;
}

#resultMessage{
    display:none;
    margin-top:20px;
    background:white;
    padding:20px;
    border:2px solid #39b54a;
    border-radius:8px;
    text-align:left;
    line-height:1.7;
}

.footer{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#39b54a;
    color:white;
    text-align:center;
    padding:10px;
}

</style>

</head>

<body>

<div class="topbar">
REGISTRATION
</div>

<div class="container">

<div class="logo1">
CINEMA
</div>

<div class="logo2">
FUNCTIONAL<br>
TRAINING
</div>

<div id="userInfo" class="user"></div>

<input
id="empid"
type="tel"
maxlength="9"
placeholder="กรอกรหัสพนักงาน 9 หลัก">

<button
id="registerBtn"
onclick="registerUser()">
REGISTER
</button>

<div id="resultMessage"></div>

</div>

<div class="footer">
LINE OA
</div>

<script>

const LIFF_ID =
"2012456984-RGi9YPD7";

let profile = null;

async function initializeLIFF(){

    await liff.init({
        liffId: LIFF_ID
    });

    if(!liff.isLoggedIn()){
        liff.login();
        return;
    }

    profile =
        await liff.getProfile();

    document.getElementById("userInfo")
        .innerHTML =
        profile.displayName;

}

async function registerUser(){

    const empId =
        document.getElementById("empid")
        .value
        .trim()
        .padStart(9,"0");

    if(!/^\d{9}$/.test(empId)){

        alert(
          "กรุณากรอกรหัสพนักงาน 9 หลัก"
        );

        return;
    }

    document.getElementById(
      "resultMessage"
    ).style.display = "block";

    document.getElementById(
      "resultMessage"
    ).innerHTML =
    `
    <h3>✅ ตรวจสอบข้อมูลเรียบร้อย</h3>
    <p>EMP ID : ${empId}</p>
    <p>LINE : ${profile.displayName}</p>
    <p>LINE USER ID : ${profile.userId}</p>
    <br>
    <p>
    ข้อมูลถูกส่งเข้าระบบแล้ว
    </p>
    `;

    document.getElementById(
      "empid"
    ).value = "";

}

initializeLIFF();

</script>

</body>
</html>
