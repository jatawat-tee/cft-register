<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cinema Functional Training</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#efefef;
}

.topbar{
    background:#39b54a;
    color:white;
    text-align:center;
    padding:10px;
    font-weight:bold;
}

.container{
    padding:30px;
    text-align:center;
}

.logo1{
    font-size:28px;
    color:#000;
    margin-top:50px;
}

.logo2{
    font-size:64px;
    color:#39b54a;
    font-weight:bold;
    line-height:0.95;
}

.user{
    margin-top:25px;
    margin-bottom:25px;
    color:#888;
    font-size:16px;
    min-height:24px;
}

button{
    width:100%;
    height:55px;
    margin-top:20px;
    background:#39b54a;
    color:white;
    border:none;
    font-size:24px;
    font-weight:bold;
    border-radius:4px;
}

.footer{
    position:fixed;
    left:0;
    bottom:0;
    width:100%;
    padding:10px;
    background:#39b54a;
    color:white;
    text-align:center;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="topbar">
REGISTRATION
</div>

<div class="container">

<div class="logo1">
CINEMA
</div>

<div class="logo2">
FUNCTIONAL<br>
TRAINING
</div>

<div id="userInfo" class="user"></div>

<button onclick="openPowerApps()">
REGISTER
</button>

</div>

<div class="footer">
LINE OA
</div>

<script>

const LIFF_ID = "2012456984-RGi9YPD7";

const POWER_APPS_URL =
"https://apps.powerapps.com/play/e/0fa9beaa-1fe4-eb88-9f79-f3312520c986/a/ae67169d-16d7-49ae-9762-4468c3fc18c4?tenantId=4b3b64f8-e08e-43bc-95bf-15d8ae1d3d5c";

let profile = null;

async function initializeLIFF(){

    try{

        await liff.init({
            liffId: LIFF_ID
        });

        if(!liff.isLoggedIn()){
            liff.login();
            return;
        }

        profile = await liff.getProfile();

        document.getElementById("userInfo").innerHTML =
            profile.displayName;

    }
    catch(error){

        console.error(error);

    }

}

function openPowerApps(){

    if(!profile){
        return;
    }

    const appUrl =
        POWER_APPS_URL +
        "&LINE_USER_ID=" +
        encodeURIComponent(profile.userId) +
        "&DISPLAY_NAME=" +
        encodeURIComponent(profile.displayName);

    window.location.href = appUrl;

}

initializeLIFF();

</script>

</body>

</html>
