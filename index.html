<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cinema Functional Training</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f2f2f2;
}

.topbar{
    background:#39b54a;
    color:white;
    text-align:center;
    padding:10px;
    font-size:12px;
    font-weight:bold;
}

.container{
    padding:30px;
    text-align:center;
}

.logo1{
    margin-top:40px;
    font-size:28px;
    color:#000;
}

.logo2{
    margin-top:5px;
    font-size:56px;
    line-height:0.95;
    color:#39b54a;
    font-weight:bold;
}

.user{
    margin-top:20px;
    margin-bottom:20px;
}

.display-name{
    font-size:18px;
    font-weight:bold;
    color:#333;
}

.line-user-id{
    margin-top:10px;
    font-size:12px;
    color:#000;
    word-break:break-all;
}

input{
    width:100%;
    height:50px;
    margin-top:35px;
    padding:12px;
    border:2px solid #39b54a;
    border-radius:4px;
    font-size:16px;
}

button{
    width:100%;
    height:55px;
    margin-top:15px;
    border:none;
    border-radius:4px;
    background:#39b54a;
    color:white;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

.footer{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#39b54a;
    color:white;
    text-align:center;
    padding:8px;
    font-size:12px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="topbar">
REGISTRATION
</div>

<div class="container">

    <div class="logo1">
        CINEMA
    </div>

    <div class="logo2">
        FUNCTIONAL<br>
        TRAINING
    </div>

    <div id="userInfo" class="user">
        Loading...
    </div>

    <input
        id="empid"
        type="text"
        maxlength="9"
        placeholder="กรอกรหัสพนักงาน 9 หลัก">

    <button onclick="register()">
        REGISTER
    </button>

</div>

<div class="footer">
LINE OA
</div>

<script>

const LIFF_ID = "2012456984-RGi9YPD7";

let profile = null;

async function initializeLIFF(){

    try{

        await liff.init({
            liffId: LIFF_ID
        });

        if(!liff.isLoggedIn()){
            liff.login();
            return;
        }

        profile = await liff.getProfile();

        console.log(profile);

        document.getElementById("userInfo").innerHTML =
        `
        <div class="display-name">
            ${profile.displayName}
        </div>

        <div class="line-user-id">
            ${profile.userId}
        </div>
        `;

    }
    catch(error){

        console.error("LIFF ERROR:", error);

        document.getElementById("userInfo").innerHTML =
        `
        <div style="color:red;">
            LIFF ERROR
        </div>
        `;

    }

}

async function register(){

    const empId =
        document.getElementById("empid").value.trim();

    if(empId === ""){

        alert("กรุณากรอกรหัสพนักงาน");

        return;
    }

    const payload = {

        EMP_ID: empId,

        LINE_USER_ID: profile ? profile.userId : "",

        LINE_DISPLAY_NAME: profile ? profile.displayName : ""

    };

    console.log(payload);

    alert(
        "EMP_ID : " + empId +
        "\n\nLINE USER ID : " +
        payload.LINE_USER_ID +
        "\n\nDISPLAY NAME : " +
        payload.LINE_DISPLAY_NAME
    );

    /*
    STEP ถัดไป

    await fetch("HTTP_POST_URL",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify(payload)
    });

    */

}

initializeLIFF();

</script>

</body>

</html>
