<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Cinema Functional Training</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#efefef;
}

.topbar{
    background:#39b54a;
    color:#fff;
    text-align:center;
    padding:10px;
    font-weight:bold;
}

.container{
    padding:30px;
    text-align:center;
}

.logo1{
    font-size:28px;
    margin-top:60px;
}

.logo2{
    font-size:64px;
    font-weight:bold;
    line-height:.95;
    color:#39b54a;
}

.user{
    margin-top:20px;
    margin-bottom:20px;
    color:#666;
}

input{
    width:100%;
    padding:14px;
    border:2px solid #39b54a;
    font-size:18px;
    box-sizing:border-box;
}

button{
    width:100%;
    height:55px;
    margin-top:20px;
    border:none;
    border-radius:6px;
    background:#39b54a;
    color:white;
    font-size:22px;
    font-weight:bold;
}

#resultMessage{
    display:none;
    margin-top:20px;
    background:white;
    border:2px solid #39b54a;
    border-radius:8px;
    padding:20px;
}

.footer{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:#39b54a;
    color:white;
    text-align:center;
    padding:10px;
}

</style>
</head>

<body>

<div class="topbar">
REGISTRATION
</div>

<div class="container">

<div class="logo1">
CINEMA
</div>

<div class="logo2">
FUNCTIONAL<br>
TRAINING
</div>

<div id="userInfo" class="user"></div>

<input
id="empid"
type="tel"
inputmode="numeric"
maxlength="9"
placeholder="กรอกรหัสพนักงาน 9 หลัก">

<button
id="registerBtn"
onclick="registerUser()">
REGISTER
</button>

<div id="resultMessage"></div>

</div>

<div class="footer">
LINE OA
</div>

<script>

const LIFF_ID =
"2012456984-RGi9YPD7";

const GAS_URL =
"https://script.google.com/macros/s/AKfycbyn_uG_1bB4n0hIDkI0EsRDAW1Vt5vmxuw3hon9PlRJpaVJNd1rFhyu_LmhST7uQJsE/exec";

let profile = null;

async function initializeLIFF(){

    try{

        await liff.init({
            liffId: LIFF_ID
        });

        if(!liff.isLoggedIn()){

            liff.login();
            return;

        }

        profile =
            await liff.getProfile();

        document.getElementById("userInfo").innerHTML =
            profile.displayName;

    }
    catch(error){

        console.error(error);

        alert("ไม่สามารถเชื่อมต่อ LINE ได้");

    }

}

async function registerUser(){

    const empId =
        document.getElementById("empid")
        .value
        .trim()
        .padStart(9,"0");

    if(!/^\d{9}$/.test(empId)){

        alert("กรุณากรอกรหัสพนักงาน 9 หลัก");
        return;

    }

    if(!profile){

        alert("ไม่พบข้อมูล LINE");
        return;

    }

    const payload = {

        EMP_ID: empId,
        LINE_USER_ID: profile.userId,
        LINE_DISPLAY_NAME: profile.displayName

    };

    try{

        await fetch(
            GAS_URL,
            {
                method:"POST",
                mode:"no-cors",
                headers:{
                    "Content-Type":"text/plain"
                },
                body:JSON.stringify(payload)
            }
        );

        document.getElementById("empid").style.display =
            "none";

        document.getElementById("registerBtn").style.display =
            "none";

        document.getElementById("resultMessage").style.display =
            "block";

        document.getElementById("resultMessage").innerHTML =
        `
        <div style="text-align:center">

        <h2 style="color:#39b54a">
        ✅ ลงทะเบียนสำเร็จ
        </h2>

        <p>
        ชื่อใน LINE : ${profile.displayName}
        </p>

        <p>
        EMP ID : ${empId}
        </p>

        <p>
        ระบบได้รับข้อมูลของท่านเรียบร้อยแล้ว
        </p>

        <p>
        กรุณากดปุ่มด้านล่างเพื่อกลับไปใช้งาน LINE OA
        </p>

        <button onclick="openLineOA()">
        เข้าใช้งาน LINE OA
        </button>

        </div>
        `;

    }
    catch(error){

        console.error(error);

        alert("❌ เกิดข้อผิดพลาด");

    }

}

function openLineOA(){

    window.location.href =
    "https://line.me/R/ti/p/@003bmmlp";

}

initializeLIFF();

</script>

</body>
</html>
