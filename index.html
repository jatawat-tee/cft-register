<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cinema Functional Training</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#efefef;
}

.topbar{
    background:#39b54a;
    color:white;
    text-align:center;
    padding:10px;
    font-weight:bold;
}

.container{
    padding:30px;
    text-align:center;
}

.logo1{
    font-size:28px;
    color:#000;
    margin-top:60px;
}

.logo2{
    font-size:64px;
    color:#39b54a;
    font-weight:bold;
    line-height:0.95;
    margin-bottom:30px;
}

.user{
    margin-top:20px;
    margin-bottom:20px;
    color:#666;
    font-size:16px;
}

input{
    width:100%;
    padding:14px;
    border:2px solid #39b54a;
    font-size:18px;
    background:#fff;
}

button{
    width:100%;
    height:55px;
    margin-top:20px;
    border:none;
    background:#39b54a;
    color:white;
    font-size:24px;
    font-weight:bold;
    border-radius:4px;
}

button:disabled{
    background:#999;
}

.footer{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:#39b54a;
    color:white;
    text-align:center;
    padding:10px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="topbar">
REGISTRATION
</div>

<div class="container">

<div class="logo1">
CINEMA
</div>

<div class="logo2">
FUNCTIONAL<br>
TRAINING
</div>

<div id="userInfo" class="user"></div>

<input
    id="empid"
    type="tel"
    inputmode="numeric"
    pattern="[0-9]*"
    maxlength="9"
    placeholder="กรอกรหัสพนักงาน 9 หลัก">

<button
    id="registerBtn"
    onclick="registerUser()">
    REGISTER
</button>

</div>

<div class="footer">
LINE OA
</div>

<script>

const LIFF_ID = "2012456984-RGi9YPD7";

const GAS_URL =
"https://script.google.com/macros/s/AKfycbyn_uG_1bB4n0hIDkI0EsRDAW1Vt5vmxuw3hon9PlRJpaVJNd1rFhyu_LmhST7uQJsE/exec";

let profile = null;

async function initializeLIFF(){

    try{

        await liff.init({
            liffId: LIFF_ID
        });

        if(!liff.isLoggedIn()){
            liff.login();
            return;
        }

        profile = await liff.getProfile();

        document.getElementById("userInfo").innerHTML =
            profile.displayName;

    }
    catch(error){

        console.error(error);

        alert("LIFF Error");

    }

}

async function registerUser(){

    const empId =
        document.getElementById("empid")
        .value
        .trim();

    if(empId === ""){

        alert("กรุณากรอกรหัสพนักงาน");
        return;

    }

    if(!/^\d{9}$/.test(empId)){

        alert("กรุณากรอกรหัสพนักงาน 9 หลัก");
        return;

    }

    if(!profile){

        alert("ไม่พบข้อมูล LINE");
        return;

    }

    document.getElementById("registerBtn").disabled = true;

    const payload = {

        EMP_ID: empId,
        LINE_USER_ID: profile.userId,
        LINE_DISPLAY_NAME: profile.displayName

    };

    try{

        await fetch(
            GAS_URL,
            {
                method: "POST",
                mode: "no-cors",
                headers:{
                    "Content-Type":"text/plain"
                },
                body: JSON.stringify(payload)
            }
        );

        alert("✅ ส่งข้อมูลเรียบร้อย");

        document.getElementById("empid").value = "";

    }
    catch(error){

        console.error(error);

        alert("❌ เกิดข้อผิดพลาด");

    }

    document.getElementById("registerBtn").disabled = false;

}

initializeLIFF();

</script>

</body>
</html>
