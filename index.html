<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Cinema Functional Training</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#efefef;
    font-family:Arial,sans-serif;
}

.topbar{
    background:#39b54a;
    color:#fff;
    text-align:center;
    padding:12px;
    font-weight:bold;
    font-size:18px;
}

.container{
    padding:20px;
    max-width:500px;
    margin:auto;
}

.logo1{
    font-size:24px;
    margin-top:20px;
    text-align:center;
}

.logo2{
    font-size:42px;
    color:#39b54a;
    font-weight:bold;
    line-height:1;
    text-align:center;
    margin-bottom:20px;
}

.form-card{
    background:#fff;
    border-radius:12px;
    padding:20px;
    box-shadow:
      0 2px 10px rgba(0,0,0,.08);
}

.user{
    background:#f7f7f7;
    border-radius:8px;
    padding:12px;
    margin-bottom:15px;
    color:#444;
    font-weight:bold;
}

input{
    width:100%;
    padding:18px;
    font-size:18px;
    border:2px solid #39b54a;
    border-radius:8px;
    margin-bottom:12px;
}

button{
    width:100%;
    height:58px;
    border:none;
    border-radius:10px;
    background:#39b54a;
    color:white;
    font-size:22px;
    font-weight:bold;
}

#resultMessage{
    display:none;
    margin-top:20px;
    background:white;
    border:2px solid #39b54a;
    border-radius:12px;
    padding:20px;
    line-height:1.8;
}

.success-btn{
    margin-top:20px;
}

.footer{
    margin-top:30px;
    background:#39b54a;
    color:white;
    text-align:center;
    padding:12px;
    font-size:16px;
}

</style>

</head>

<body>

<div class="topbar">
REGISTRATION
</div>

<div class="container">

<div class="logo1">
CINEMA
</div>

<div class="logo2">
FUNCTIONAL<br>
TRAINING
</div>

<div class="form-card">

    <div
    id="userInfo"
    class="user">
    กำลังโหลดข้อมูล...
    </div>

    <input
    id="empid"
    type="tel"
    inputmode="numeric"
    maxlength="9"
    placeholder="กรอกรหัสพนักงาน 9 หลัก">

    <input
    id="nickname"
    type="text"
    maxlength="50"
    placeholder="ชื่อเล่น">

    <button
    id="registerBtn"
    onclick="registerUser()">
    REGISTER
    </button>

</div>

<div id="resultMessage"></div>

</div>

<div class="footer">
LINE OA
</div>

<script>

const LIFF_ID =
"2012456984-RGi9YPD7";

const GAS_URL =
"https://script.google.com/macros/s/AKfycbyn_uG_1bB4n0hIDkI0EsRDAW1Vt5vmxuw3hon9PlRJpaVJNd1rFhyu_LmhST7uQJsE/exec";

const LINE_OA_URL =
"https://line.me/R/ti/p/@003bmmlp";

let profile = null;

async function initializeLIFF(){

    try{

        await liff.init({
            liffId: LIFF_ID
        });

        if(!liff.isLoggedIn()){

            liff.login();
            return;

        }

        profile =
            await liff.getProfile();

        document
            .getElementById("userInfo")
            .innerHTML =
            "👋 " +
            profile.displayName;

    }
    catch(error){

        console.error(error);

        alert(
          "ไม่สามารถเชื่อมต่อ LINE ได้"
        );

    }

}

async function registerUser(){

    const empId =
        document
        .getElementById("empid")
        .value
        .trim()
        .padStart(9,"0");

    const nickname =
        document
        .getElementById("nickname")
        .value
        .trim();

    if(!/^\d{9}$/.test(empId)){

        alert(
          "กรุณากรอกรหัสพนักงาน 9 หลัก"
        );

        return;
    }

    if(nickname === ""){

        alert(
          "กรุณากรอกชื่อเล่น"
        );

        return;
    }

    const payload = {

        EMP_ID: empId,

        NICKNAME: nickname,

        LINE_USER_ID:
          profile.userId,

        LINE_DISPLAY_NAME:
          profile.displayName

    };

    try{

        const response =
          await fetch(
            GAS_URL,
            {
                method:"POST",
                headers:{
                    "Content-Type":
                      "text/plain"
                },
                body:
                  JSON.stringify(payload)
            }
          );

        const result =
          await response.json();

        document
          .getElementById("empid")
          .style.display =
          "none";

        document
          .getElementById("nickname")
          .style.display =
          "none";

        document
          .getElementById("registerBtn")
          .style.display =
          "none";

        document
          .getElementById("resultMessage")
          .style.display =
          "block";

        if(
          result.status ===
          "ALREADY_REGISTERED"
        ){

          document
            .getElementById(
              "resultMessage"
            )
            .innerHTML =
            `
            <div style="text-align:center">

            <h2 style="color:#ff9800;">
            ⚠️
            ท่านเคยลงทะเบียนแล้ว
            </h2>

            <p>
            LINE นี้ลงทะเบียนไว้แล้ว
            </p>

            <button
            class="success-btn"
            onclick="openLineOA()">

            เข้าใช้งาน LINE OA

            </button>

            </div>
            `;

          return;
        }

        document
        .getElementById(
          "resultMessage"
        )
        .innerHTML =

        `
        <div style="text-align:center">

        <h2 style="color:#39b54a;">
        ✅ ลงทะเบียนสำเร็จ
        </h2>

        <p>
        ชื่อใน LINE :
        ${profile.displayName}
        </p>

        <p>
        EMP ID :
        ${empId}
        </p>

        <p>
        ชื่อเล่น :
        ${nickname}
        </p>

        <p>
        ระบบได้รับข้อมูลเรียบร้อยแล้ว
        </p>

        <button
        class="success-btn"
        onclick="openLineOA()">

        เข้าใช้งาน LINE OA

        </button>

        </div>
        `;

    }
    catch(error){

        console.error(error);

        alert(
          "❌ เกิดข้อผิดพลาด"
        );

    }

}

function openLineOA(){

    window.location.href =
      LINE_OA_URL;

}

initializeLIFF();

</script>

</body>
</html>
