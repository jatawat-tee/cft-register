<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cinema Functional Training</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#efefef;
}

.topbar{
    background:#39b54a;
    color:white;
    text-align:center;
    padding:10px;
    font-weight:bold;
}

.container{
    padding:30px;
    text-align:center;
}

.logo1{
    font-size:28px;
    color:#000;
    margin-top:60px;
}

.logo2{
    font-size:64px;
    color:#39b54a;
    font-weight:bold;
    line-height:0.95;
    margin-bottom:30px;
}

.user{
    margin-top:15px;
    margin-bottom:20px;
    color:#666;
    font-size:16px;
}

input{
    width:100%;
    padding:14px;
    border:2px solid #39b54a;
    font-size:18px;
    background:#fff;
}

button{
    width:100%;
    height:55px;
    margin-top:20px;
    border:none;
    background:#39b54a;
    color:white;
    font-size:24px;
    font-weight:bold;
    border-radius:4px;
}

.footer{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:#39b54a;
    color:white;
    text-align:center;
    padding:10px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="topbar">
REGISTRATION
</div>

<div class="container">

<div class="logo1">
CINEMA
</div>

<div class="logo2">
FUNCTIONAL<br>
TRAINING
</div>

<div id="userInfo" class="user"></div>

<input
    id="empid"
    type="text"
    maxlength="9"
